<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Granko</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192x192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Granko">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pacifico&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 class="app-title">Granko</h1>
    <nav class="tabs">
      <button class="tab" data-tab="live">Na żywo</button>
      <button class="tab" data-tab="tactics">Taktyki</button>
      <button class="tab" data-tab="lineups">Line-upy</button>
      <button class="tab" data-tab="matches">Mecze</button>
      <button class="tab" data-tab="players">Gracze</button>
      <button class="tab" data-tab="team">Drużyna</button>
    </nav>
  </header>

  <main>
    <section id="live" class="live" hidden></section>
    <section id="tab-live" class="panel" hidden></section>
    <section id="tab-tactics" class="panel" hidden></section>
    <section id="tab-lineups" class="panel" hidden></section>
    <section id="tab-matches" class="panel" hidden>
      <div id="matches"><p class="muted">Ładuję…</p></div>
    </section>
    <section id="tab-players" class="panel" hidden>
      <div id="players"></div>
    </section>
    <section id="tab-team" class="panel" hidden></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
